name: CI/CD Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  imagem:
    needs: testar
    runs-on: ubuntu-latest
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}   # opcional: se existir, publica também no Docker Hub
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login no Docker Hub
        if: github.event_name != 'pull_request' && env.DH_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir tags
        id: tags
        run: |
          VERSAO=$(cat VERSION 2>/dev/null || echo 0.0.0)
          NOME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAGS="$REPO:latest,$REPO:$VERSAO,$REPO:${GITHUB_SHA::7}"
          if [ -n "$DH_USER" ]; then
            TAGS="$TAGS,$DH_USER/$NOME:latest,$DH_USER/$NOME:$VERSAO"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build (e push, fora de pull requests)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Resumo
        if: github.event_name != 'pull_request'
        run: |
          echo "### Imagem Docker publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags: \`${{ steps.tags.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
